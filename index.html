<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="加班记" />
  <meta name="description" content="加班记 - 免费无广告的加班工时记录与月薪计算工具" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>加班记</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="app-header" id="appHeader">
    <div class="header-inner">
      <span class="app-logo" aria-hidden="true"></span>
      <div class="header-titles">
        <div class="header-title" id="headerTitle">加班记</div>
        <div class="header-sub" id="headerSub">记录每一天</div>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="app-main" id="appMain"></main>

  <!-- 悬浮"今天"按钮：记录 / 工资页显示，点击回到今天所在月份 -->
  <button type="button" class="fab-today" id="fabToday" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3v4M16 3v4M3 10h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    今天
  </button>

  <!-- 底部导航 -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="records">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
      <span class="tab-label">记录</span>
    </button>
    <button class="tab-btn" data-tab="salary">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 6V5a1.5 1.5 0 0 0-1.5-1.5h-5A1.5 1.5 0 0 0 8 5v1"/><circle cx="16" cy="13" r="2" fill="currentColor" stroke="none"/></svg></span>
      <span class="tab-label">工资</span>
    </button>
    <button class="tab-btn" data-tab="stats">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/></svg></span>
      <span class="tab-label">统计</span>
    </button>
    <button class="tab-btn" data-tab="settings">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="17" r="2"/></svg></span>
      <span class="tab-label">设置</span>
    </button>
  </nav>

  <!-- 轻提示 -->
  <div class="toast" id="toast"></div>

  <!-- 弹窗容器 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal" id="modalBox"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/lunar.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
